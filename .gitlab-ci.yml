default:
  before_script:
    - set -e
    # DANGER don't use `set -x` or print the environment via e.g. `env` in pipeline runs, this might leak credentials (has leaked them)
  interruptible: true
  tags:
    - 1cpu-4gb

variables:
  API_DOMAIN_PATH: '$CI_PROJECT_DIR/api_domain'

.deploy:
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.13.5'
    entrypoint: ['/bin/sh', '-c']
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - 'terraform/environments/crash.log'
      - 'terraform/environments/terraform-*.log'
      - $API_DOMAIN_PATH
    name: '${CI_JOB_NAME}_${CI_JOB_ID}'
    expire_in: 1 month
  script:
    - terraform/environments/scripts/create-or-update-env.sh "$ENVIRONMENT_ID" "$CI_COMMIT_SHA"
    - echo "$(terraform/environments/scripts/get-output.sh api_domain)" > "$API_DOMAIN_PATH"
  resource_group: $ENVIRONMENT_ID
  interruptible: false

.smoketest:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker/holi-docker/holi-k6-builder'
  script:
    - API_DOMAIN=$(cat "$API_DOMAIN_PATH")
    - terraform/environments/scripts/wait-for-ssl.sh "https://${API_DOMAIN}"
    - BASE_URL="https://${API_DOMAIN}/graphql" k6 run smoketest/main.js
    # TODO should/could we roll back the service to the last working revision on test failure?

cache_lint:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/denoland/deno:2.2.15'
  stage: 'test'
  script:
    - deno cache --allow-import --lock=deno.lock app/deps.ts app/dev_deps.ts
    - deno fmt --check
    - deno lint
sast:
  needs: ['cache_lint']
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml

build_docker:
  needs: ['cache_lint']
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28'
  services:
    - name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:28-dind'
      alias: 'docker'
  variables:
    GCR_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-translation-api
  script:
    - docker pull "$GCR_IMAGE" || true
    - docker build --cache-from "$GCR_IMAGE" -t "$GCR_IMAGE":latest -t "$GCR_IMAGE":"$CI_COMMIT_SHA" -t "$GCR_IMAGE":"$CI_COMMIT_REF_SLUG" .
    - docker push "$GCR_IMAGE":"$CI_COMMIT_SHA"
    - docker push "$GCR_IMAGE":"$CI_COMMIT_REF_SLUG"
    - docker push "$GCR_IMAGE":latest # for caching the build

## staging environment

staging_deploy:
  extends: .deploy
  needs: ['build_docker']
  environment:
    name: staging
    deployment_tier: staging
    url: https://staging.translation.apis.holi.social
  variables:
    ENVIRONMENT_ID: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

staging_smoketest:
  extends: .smoketest
  needs: ['staging_deploy']
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

staging_trigger_unified-api_redeployment:
  needs: ['staging_smoketest']
  trigger:
    project: 'app/holi-unified-api'
    branch: 'main'
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  resource_group: unified-api-staging

## production environment

production_deploy:
  extends: .deploy
  needs: ['build_docker']
  allow_failure: false
  environment:
    name: production
    deployment_tier: production
    url: https://production.translation.apis.holi.social
  variables:
    ENVIRONMENT_ID: production
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success

production_smoketest:
  extends: .smoketest
  needs: ['production_deploy']
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success

production_trigger_unified-api_redeployment:
  needs: ['production_smoketest']
  trigger:
    project: 'app/holi-unified-api'
    branch: 'production'
    forward:
      yaml_variables: false
      pipeline_variables: false
  rules:
    - if: $CI_COMMIT_BRANCH == "production"
      when: on_success
  resource_group: unified-api-production
