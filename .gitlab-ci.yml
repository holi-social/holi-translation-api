default:
  before_script:
    - set -ex
    - env
  interruptible: true
  tags:
    - 1cpu-4gb

variables:
  API_DOMAIN_PATH: "$CI_PROJECT_DIR/api_domain"

.deploy:
  image:
    name: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/hashicorp/terraform:1.6.1'
    entrypoint: ["/bin/sh", "-c"]
  variables:
    ENVIRONMENT_ID: $CI_ENVIRONMENT_SLUG
  artifacts:
    paths:
      - "terraform/environments/crash.log"
      - "terraform/environments/terraform-*.log"
      - $API_DOMAIN_PATH
    name: "${CI_JOB_NAME}_${CI_JOB_ID}"
    expire_in: 1 month
  script:
    - terraform/environments/scripts/create-or-update-env.sh $ENVIRONMENT_ID $CI_COMMIT_SHA
    - echo "$(terraform/environments/scripts/get-api-domain.sh)" > $API_DOMAIN_PATH
  resource_group: $ENVIRONMENT_ID
  interruptible: false

cache_lint:
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/denoland/deno:alpine-1.40.1'
  stage: "test"
  script:
    - deno cache --lock=deno.lock app/deps.ts app/dev_deps.ts
    - deno fmt --check
    - deno lint
sast:
  needs: ["cache_lint"]
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml

build_docker:
  needs: ["cache_lint"]
  image: 'europe-north1-docker.pkg.dev/holi-shared/docker-hub-remote/docker:20.10'
  services:
    - docker:20.10-dind
  variables:
    GCR_IMAGE: europe-north1-docker.pkg.dev/holi-shared/docker/holi-translation-api
  script:
    - docker pull $GCR_IMAGE || true
    - docker build --cache-from $GCR_IMAGE -t $GCR_IMAGE:latest -t $GCR_IMAGE:$CI_COMMIT_SHA -t $GCR_IMAGE:$CI_COMMIT_REF_SLUG .
    - docker push $GCR_IMAGE:$CI_COMMIT_SHA
    - docker push $GCR_IMAGE:$CI_COMMIT_REF_SLUG

## staging environment

staging_deploy:
  extends: .deploy
  needs: ["build_docker"]
  environment:
    name: staging
    deployment_tier: staging
    url: https://staging.translation.apis.holi.social
  variables:
    ENVIRONMENT_ID: staging
  only:
    - main

staging_trigger_unified-api_redeployment:
  needs: ["staging_deploy"]
  trigger:
    project: "app/holi-unified-api"
    branch: "main"
  only:
    - main

## production environment

production_deploy:
  extends: .deploy
  needs: ["build_docker"]
  allow_failure: false
  environment:
    name: production
    deployment_tier: production
    url: https://production.translation.apis.holi.social
  variables:
    ENVIRONMENT_ID: production
  only:
    - production

production_trigger_unified-api_redeployment:
  needs: ["production_deploy"]
  trigger:
    project: "app/holi-unified-api"
    branch: "production"
  only:
    - production
